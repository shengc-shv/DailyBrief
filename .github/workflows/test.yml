name: Test Run (No AI, No Publish)

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      
      - name: Install dependencies
        run: npm ci
      
      - name: Run crawlers
        run: node scripts/crawlers/run-all.mjs
        continue-on-error: true
      
      - name: Ensure data file exists
        run: |
          mkdir -p data
          if [ ! -f data/crawled-articles.json ]; then
            echo '[]' > data/crawled-articles.json
          fi
      
      - name: Dry run (no AI)
        run: npm run dry-run
      
      - name: Upload HTML for preview
        uses: actions/upload-artifact@v4
        with:
          name: preview-report
          path: daily_reports/
